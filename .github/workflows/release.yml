name: Publish container and release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: node_explorer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d node_explorer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_POSTGRES_URL: postgresql://postgres:test_password@127.0.0.1:5432/node_explorer_test
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Lint and test the Go backend
        env:
          NODE_EXPLORER_TEST_REDIS: redis://127.0.0.1:6379/0
          NODE_EXPLORER_TEST_PG: postgresql://postgres:test_password@127.0.0.1:5432/node_explorer_test
        working-directory: backend
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...
          go test -race ./...
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run -d --read-only --tmpfs /tmp --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=node_explorer_test \
            -e PGUSER=postgres -e PGPASSWORD=test_password --name node-explorer-smoke "$IMAGE_NAME@$IMAGE_DIGEST"
          trap 'docker logs node-explorer-smoke; docker rm -f node-explorer-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3001/api/health
          curl --fail http://127.0.0.1:3001/api/history -o /tmp/history.json
          node -e "const h = JSON.parse(require('fs').readFileSync('/tmp/history.json')); if (h.total !== 0 || h.items.length !== 0) process.exit(1)"
          curl --fail http://127.0.0.1:3001/ -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          test "$(curl --silent -o /tmp/results.json -w '%{http_code}' http://127.0.0.1:3001/api/results)" = 404
      - name: Smoke test independent lifecycle worker
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run -d --read-only --tmpfs /tmp --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=node_explorer_test \
            -e PGUSER=postgres -e PGPASSWORD=test_password -e REDIS_URL=redis://127.0.0.1:6379/0 \
            --name lifecycle-smoke "$IMAGE_NAME@$IMAGE_DIGEST" node-worker -role lifecycle
          trap 'docker logs lifecycle-smoke; docker rm -f lifecycle-smoke' EXIT
          for attempt in $(seq 1 20); do
            if docker exec lifecycle-smoke node-worker -role lifecycle -health; then break; fi
            sleep 1
          done
          docker exec lifecycle-smoke node-worker -role lifecycle -health
      - name: Package production files
        if: startsWith(github.ref, 'refs/tags/')
        run: tar -czf node-explorer-${{ github.ref_name }}.tar.gz dist backend legacy package.json package-lock.json Dockerfile compose.yaml compose.subs-check.yaml compose.pgsql.yaml compose.ippure.yaml compose.patrol.yaml compose.patrol.pgsql.yaml compose.qilan.yaml deploy README.md MODULAR_SERVICES.md RESIDENTIAL_RECOVERY.md .env.example
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '容器镜像：`%s:%s`\n\n镜像摘要：`%s`\n\n同一镜像运行 API、来源导入、测活、IP 属性、住宅恢复、生命周期六个独立服务。PostgreSQL 保存业务状态，Redis 分发任务；住宅节点每 5 分钟检查，一次完整验证通过即恢复。升级前阅读 MODULAR_SERVICES.md，并更新 Compose 文件。\n' "$IMAGE_NAME" "$GITHUB_REF_NAME" "$IMAGE_DIGEST" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" "node-explorer-$GITHUB_REF_NAME.tar.gz" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --verify-tag
