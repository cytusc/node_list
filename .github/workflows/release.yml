name: Publish container and release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: node_explorer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d node_explorer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_POSTGRES_URL: postgresql://postgres:test_password@127.0.0.1:5432/node_explorer_test
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Lint and test the Go backend
        env:
          NODE_EXPLORER_TEST_REDIS: redis://127.0.0.1:6379/0
          NODE_EXPLORER_TEST_PG: postgresql://postgres:test_password@127.0.0.1:5432/node_explorer_test
        working-directory: backend
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...
          go test -race ./...
      - name: Verify real Mihomo routing and timeout capacity
        working-directory: backend
        run: |
          curl -fL --retry 3 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.27/mihomo-linux-amd64-v1.19.27.gz -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          MIHOMO_TEST_BINARY=/tmp/mihomo MIHOMO_TIMEOUT_BENCH=1 go test -race ./internal/transport -run TestRealManager -count=1 -v
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, pcntl, sockets
          coverage: none
          tools: composer
      - name: Test the webman API (offline + integration)
        run: |
          composer install --working-dir=webman --no-interaction --no-progress --quiet
          php webman/tests/run.php
          # 独立库：集成夹具会 TRUNCATE 相关表，不能和 Go 测试/冒烟共用 node_explorer_test
          psql "postgresql://postgres:test_password@127.0.0.1:5432/postgres" \
            -c "DROP DATABASE IF EXISTS node_explorer_webman_test" \
            -c "CREATE DATABASE node_explorer_webman_test"
          PGURL="postgresql://postgres:test_password@127.0.0.1:5432/node_explorer_webman_test" \
            bash webman/tests/fixtures/load.sh
          PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGPASSWORD=test_password \
            PGDATABASE=node_explorer_webman_test php webman/tests/integration.php
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # 冒烟库是全新库，但接口层只读取 node_explorer_live_* 视图（原由 Go 后端迁移创建，
          # Go 下线后这些 DDL 不再随镜像启动执行）。这里手动建 schema（视图 + 基表），
          # 但不可灌 seed——否则 /api/results 的 total!=0 断言会失败。
          # 生产 PG 在 v1.4.12 时代已由 Go 迁移建好这些对象，部署不受影响。
          psql "postgresql://postgres:test_password@127.0.0.1:5432/postgres" \
            -c "DROP DATABASE IF EXISTS node_explorer_test" \
            -c "CREATE DATABASE node_explorer_test"
          for f in webman/tests/fixtures/core.sql \
                   backend/internal/store/postgres/services.sql \
                   backend/internal/store/postgres/live.sql; do
            psql "postgresql://postgres:test_password@127.0.0.1:5432/node_explorer_test" \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done
          # read_only 下 PHP 的 runtime/（pid/status/log/缓存）必须是 tmpfs，
          # 否则 Workerman 起不来——这正是 compose 里 node-explorer 的 tmpfs 段。
          docker run -d --read-only --tmpfs /tmp --tmpfs /app/webman/runtime:mode=0777 --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=node_explorer_test \
            -e PGUSER=postgres -e PGPASSWORD=test_password --name node-explorer-smoke "$IMAGE_NAME@$IMAGE_DIGEST"
          trap 'docker logs node-explorer-smoke; docker rm -f node-explorer-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3001/api/health
          curl --fail 'http://127.0.0.1:3001/api/results?page=1&limit=50' -o /tmp/results.json
          node -e "const r = JSON.parse(require('fs').readFileSync('/tmp/results.json')); if (r.total !== 0 || r.nodes.length !== 0) process.exit(1)"
          curl --fail http://127.0.0.1:3001/ -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/history)" = 404
      - name: Smoke test independent lifecycle worker
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run -d --read-only --tmpfs /tmp --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=node_explorer_test \
            -e PGUSER=postgres -e PGPASSWORD=test_password -e REDIS_URL=redis://127.0.0.1:6379/0 \
            --name lifecycle-smoke "$IMAGE_NAME@$IMAGE_DIGEST" node-worker -role lifecycle
          trap 'docker logs lifecycle-smoke; docker rm -f lifecycle-smoke' EXIT
          for attempt in $(seq 1 20); do
            if docker exec lifecycle-smoke node-worker -role lifecycle -health; then break; fi
            sleep 1
          done
          docker exec lifecycle-smoke node-worker -role lifecycle -health
      - name: Package production files
        if: startsWith(github.ref, 'refs/tags/')
        # webman/ 只打包源码：vendor 由镜像的 composer stage 重装，runtime 是运行产物。
        # 生产跑容器镜像，这份 tar 是服务器上的参考副本与部署脚本集合。
        run: tar -czf node-explorer-${{ github.ref_name }}.tar.gz --exclude='webman/vendor' --exclude='webman/runtime' --exclude='webman/composer.phar' dist backend webman legacy package.json package-lock.json Dockerfile SINGLE_MIHOMO.md compose.legacy-mihomo.yaml compose.yaml compose.subs-check.yaml compose.qilan.yaml deploy README.md MODULAR_SERVICES.md RESIDENTIAL_RECOVERY.md .env.example
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '容器镜像：`%s:%s`\n\n镜像摘要：`%s`\n\n所有探测服务共享单个 Mihomo 内核；快速测活请求 gstatic 204，普通节点测活与恢复评估默认每 20 分钟调度，住宅复核每 5 分钟。204 成功会更新连通性证明，但节点恢复还要求独立真实出口及适用的属性核验。单实例数据库锁阻止同一后台服务重复运行，原有服务内并发保持不变。升级步骤、CPU 预算和回滚方式见 SINGLE_MIHOMO.md。\n' "$IMAGE_NAME" "$GITHUB_REF_NAME" "$IMAGE_DIGEST" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" "node-explorer-$GITHUB_REF_NAME.tar.gz" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --verify-tag
