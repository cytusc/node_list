name: Publish container and release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: node_explorer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d node_explorer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_POSTGRES_URL: postgresql://postgres:test_password@127.0.0.1:5432/node_explorer_test
      - run: npm run build
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run -d --read-only --tmpfs /tmp --name node-explorer-smoke -p 127.0.0.1:3001:3001 "$IMAGE_NAME@$IMAGE_DIGEST"
          trap 'docker logs node-explorer-smoke; docker rm -f node-explorer-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3001/api/health
          docker exec node-explorer-smoke node --input-type=module -e "import { chromium } from 'playwright-core'; const browser = await chromium.launch({ executablePath: '/usr/bin/chromium', args: ['--no-sandbox', '--disable-dev-shm-usage'] }); const page = await browser.newPage(); await page.setContent('<p>Chromium smoke test</p>'); if (await page.textContent('p') !== 'Chromium smoke test') throw new Error('Chromium smoke test failed'); await browser.close();"
          curl --fail http://127.0.0.1:3001/api/history -o /tmp/history.json
          node -e "const h = JSON.parse(require('fs').readFileSync('/tmp/history.json')); if (h.total !== 0 || h.items.length !== 0) process.exit(1)"
          curl --fail http://127.0.0.1:3001/ -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          test "$(curl --silent -o /tmp/results.json -w '%{http_code}' http://127.0.0.1:3001/api/results)" = 404
      - name: Package production files
        if: startsWith(github.ref, 'refs/tags/')
        run: tar -czf node-explorer-${{ github.ref_name }}.tar.gz dist server package.json package-lock.json Dockerfile compose.yaml compose.subs-check.yaml compose.pgsql.yaml compose.ippure.yaml deploy README.md .env.example
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '容器镜像：`%s:%s`\n\n镜像摘要：`%s`\n\n支持 linux/amd64 和 linux/arm64。IPPure 检测先获取目标节点的出口 IP，再通过可用节点轮换查询指定 IP，并将结果保存到原节点；查询和出口探测均不回退直连，此前旧方式失败的节点可在新模式下重新检测。保留 ASN 编号和组织名称提取、SQLite/PostgreSQL 持久化及当前批次补采。电脑列表以独立列显示 ASN 组织、IP 来源、IP 属性、IPPure 系数及人机流量比，支持单独显隐与排序；手机按字段展示。启用检测需在 COMPOSE_FILE 追加 compose.ippure.yaml。连接、网络和目录映射通过服务器 .env 配置。部署说明见 README.md；请保留数据库与 subs-check 数据目录。\n' "$IMAGE_NAME" "$GITHUB_REF_NAME" "$IMAGE_DIGEST" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" "node-explorer-$GITHUB_REF_NAME.tar.gz" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --verify-tag
