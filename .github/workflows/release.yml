name: Publish container and release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests and frontend assets
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: node_explorer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d node_explorer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test deployment updater
        run: |
          bash -n deploy/update.sh
          python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Lint and test the Go backend
        env:
          NODE_EXPLORER_TEST_REDIS: redis://127.0.0.1:6379/0
          NODE_EXPLORER_TEST_PG: postgresql://postgres:test_password@127.0.0.1:5432/node_explorer_test
        working-directory: backend
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...
          go test -race ./...
      - name: Verify real Mihomo routing and timeout capacity
        working-directory: backend
        run: |
          curl -fL --retry 3 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.27/mihomo-linux-amd64-v1.19.27.gz -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          MIHOMO_TEST_BINARY=/tmp/mihomo MIHOMO_TIMEOUT_BENCH=1 go test -race ./internal/transport -run TestRealManager -count=1 -v
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, pdo_sqlite, pcntl, sockets
          coverage: none
          tools: composer
      - name: Test the webman API (offline + integration)
        run: |
          composer install --working-dir=webman --no-interaction --no-progress --quiet
          php webman/tests/run.php
          php webman/tests/auth.php
          # 独立库：集成夹具会 TRUNCATE 相关表，不能和 Go 测试/冒烟共用 node_explorer_test
          psql "postgresql://postgres:test_password@127.0.0.1:5432/postgres" \
            -c "DROP DATABASE IF EXISTS node_explorer_webman_test" \
            -c "CREATE DATABASE node_explorer_webman_test"
          PGURL="postgresql://postgres:test_password@127.0.0.1:5432/node_explorer_webman_test" \
            bash webman/tests/fixtures/load.sh
          PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGPASSWORD=test_password \
            PGDATABASE=node_explorer_webman_test php webman/tests/integration.php
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build and smoke test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: node_explorer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d node_explorer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
      # Registry caches are shared across tags; GHA caches created on a tag
      # cannot be restored by the next tag. Keep one cache per architecture.
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
      - name: Prepare native smoke test tools
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          curl -fL --retry 3 "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.27/mihomo-linux-${ARCH}-v1.19.27.gz" -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
      - name: Smoke test published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # 冒烟库是全新库，但接口层只读取 node_explorer_live_* 视图（原由 Go 后端迁移创建，
          # Go 下线后这些 DDL 不再随镜像启动执行）。这里手动建 schema（视图 + 基表），
          # 但不可灌 seed——否则 /api/results 的 total!=0 断言会失败。
          # 生产 PG 在 v1.4.12 时代已由 Go 迁移建好这些对象，部署不受影响。
          psql "postgresql://postgres:test_password@127.0.0.1:5432/postgres" \
            -c "DROP DATABASE IF EXISTS node_explorer_test" \
            -c "CREATE DATABASE node_explorer_test"
          for f in webman/tests/fixtures/core.sql \
                   backend/internal/store/postgres/services.sql \
                   backend/internal/store/postgres/live.sql; do
            psql "postgresql://postgres:test_password@127.0.0.1:5432/node_explorer_test" \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done
          # read_only 下 PHP 的 runtime/（pid/status/log/缓存）必须是 tmpfs，
          # 否则 Workerman 起不来——这正是 compose 里 node-explorer 的 tmpfs 段。
          AUTH_PASSWORD_HASH=$(docker run --rm --entrypoint php "$IMAGE_NAME@$IMAGE_DIGEST" -r "echo password_hash('smoke-test-password', PASSWORD_DEFAULT);")
          docker run -d --read-only --tmpfs /tmp --tmpfs /app/webman/runtime:mode=0777 --network host \
            -e AUTH_USERNAME=smoke -e AUTH_PASSWORD_HASH="$AUTH_PASSWORD_HASH" -e AUTH_COOKIE_SECURE=false \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=node_explorer_test \
            -e PGUSER=postgres -e PGPASSWORD=test_password --name node-explorer-smoke "$IMAGE_NAME@$IMAGE_DIGEST"
          trap 'docker logs node-explorer-smoke; docker rm -f node-explorer-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3001/api/health
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/results)" = 401
          curl --fail -c /tmp/node-explorer-smoke.cookies -H 'X-Node-Explorer: 1' -H 'Content-Type: application/json' \
            --data '{"username":"smoke","password":"smoke-test-password"}' http://127.0.0.1:3001/api/auth/login
          curl --fail -b /tmp/node-explorer-smoke.cookies 'http://127.0.0.1:3001/api/results?page=1&limit=50' -o /tmp/results.json
          node -e "const r = JSON.parse(require('fs').readFileSync('/tmp/results.json')); if (r.total !== 0 || r.nodes.length !== 0) process.exit(1)"
          curl --fail http://127.0.0.1:3001/ -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/history)" = 404
      - name: Smoke test independent node liveness
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run -d --read-only --tmpfs /tmp --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=node_explorer_test \
            -e PGUSER=postgres -e PGPASSWORD=test_password \
            --name liveness-smoke "$IMAGE_NAME@$IMAGE_DIGEST" node-liveness
          trap 'docker logs liveness-smoke; docker rm -f liveness-smoke' EXIT
          for attempt in $(seq 1 20); do
            if docker exec liveness-smoke node-liveness -health; then break; fi
            sleep 1
          done
          docker exec liveness-smoke node-liveness -health
      - name: Smoke test Mihomo manager worker
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p /tmp/mihomo-manager-smoke
          printf 'mixed-port: 17890\nallow-lan: true\nbind-address: "127.0.0.1"\nmode: rule\nexternal-controller: 127.0.0.1:19090\nsecret: "smoke-controller-secret"\nauthentication: ["disabled:disabled"]\nrules: ["MATCH,REJECT"]\n' > /tmp/mihomo-manager-smoke.yaml
          /tmp/mihomo -d /tmp/mihomo-manager-smoke -f /tmp/mihomo-manager-smoke.yaml >/tmp/mihomo-manager-smoke.log 2>&1 &
          mihomo_pid=$!
          trap 'docker logs mihomo-manager-smoke 2>/dev/null || true; docker rm -f mihomo-manager-smoke >/dev/null 2>&1 || true; kill "$mihomo_pid" 2>/dev/null || true; wait "$mihomo_pid" 2>/dev/null || true; cat /tmp/mihomo-manager-smoke.log' EXIT
          docker run -d --read-only --tmpfs /tmp --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=node_explorer_test \
            -e PGUSER=postgres -e PGPASSWORD=test_password \
            -e MIHOMO_MANAGER_TOKEN=smoke-manager-token -e MIHOMO_CONTROLLER_SECRET=smoke-controller-secret \
            -e MIHOMO_CONTROLLER=http://127.0.0.1:19090 -e MIHOMO_PROXY_URL=http://127.0.0.1:17890 \
            -e MIHOMO_MANAGER_LISTEN=127.0.0.1:9080 \
            --name mihomo-manager-smoke "$IMAGE_NAME@$IMAGE_DIGEST" node-worker -role mihomo-manager
          for attempt in $(seq 1 20); do
            if curl --fail --silent -H 'Authorization: Bearer smoke-controller-secret' http://127.0.0.1:19090/version >/dev/null; then break; fi
            sleep 1
          done
          curl --fail -H 'Authorization: Bearer smoke-controller-secret' http://127.0.0.1:19090/version
          for attempt in $(seq 1 30); do
            if docker exec mihomo-manager-smoke node-worker -role mihomo-manager -health; then break; fi
            sleep 1
          done
          docker exec mihomo-manager-smoke node-worker -role mihomo-manager -health
      # Only expose digests to the publish job after all smoke checks pass.
      - name: Export tested image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish tested images and release
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: /tmp/digests
          merge-multiple: true
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha
      - name: Publish multi-architecture manifest
        id: manifest
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          images=()
          for digest in /tmp/digests/*; do
            digest="${digest##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            images+=("$IMAGE_NAME@sha256:$digest")
          done
          test "${#images[@]}" -eq 2
          docker buildx imagetools create "${tag_args[@]}" "${images[@]}"
          first_tag="${IMAGE_TAGS%%$'\n'*}"
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -er '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Package production files
        if: startsWith(github.ref, 'refs/tags/')
        # webman/ 只打包源码：vendor 由镜像的 composer stage 重装，runtime 是运行产物。
        # 生产跑容器镜像，这份 tar 是服务器上的参考副本与部署脚本集合。
        run: tar -czf node-explorer-${{ github.ref_name }}.tar.gz --exclude='webman/vendor' --exclude='webman/runtime' --exclude='webman/composer.phar' dist backend webman package.json package-lock.json Dockerfile SINGLE_MIHOMO.md NODE_CLEANUP.md compose.yaml compose.subs-check.yaml compose.qilan.yaml deploy README.md MODULAR_SERVICES.md RESIDENTIAL_RECOVERY.md .env.example
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          printf '容器镜像：`%s:%s`\n\n镜像摘要：`%s`\n\n独立 node-liveness 服务唯一维护节点可用状态：兼容节点优先 Xray，其他节点及 Xray 失败回退 Mihomo；移除 recovery、dead-verify 和 manager sweeper。部署说明见 docs/service-refactoring/10-node-liveness.md。\n' "$IMAGE_NAME" "$GITHUB_REF_NAME" "$IMAGE_DIGEST" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" "node-explorer-$GITHUB_REF_NAME.tar.gz" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --verify-tag
