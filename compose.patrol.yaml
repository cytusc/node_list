# Append to COMPOSE_FILE. Add compose.patrol.pgsql.yaml when using PostgreSQL.
services:
  github-patrol:
    image: ghcr.io/cytusc/node_list:${IMAGE_TAG:-v1.3.19}
    command: ["/usr/local/bin/github-patrol"]
    restart: unless-stopped
    init: true
    environment:
      DATABASE_PATH: /data/history/nodes.sqlite
      GITHUB_PATROL_CONTROLLER: http://github-patrol-proxy:9090
      GITHUB_PATROL_PROXY_URL: http://github-patrol-proxy:7890
      GITHUB_PATROL_INTERVAL_SECONDS: ${GITHUB_PATROL_INTERVAL_SECONDS:-1800}
      GITHUB_PATROL_CONCURRENCY: ${GITHUB_PATROL_CONCURRENCY:-2}
      GITHUB_PATROL_TIMEOUT_SECONDS: ${GITHUB_PATROL_TIMEOUT_SECONDS:-12}
      GITHUB_PATROL_RETRY_SECONDS: ${GITHUB_PATROL_RETRY_SECONDS:-10}
    depends_on:
      github-patrol-proxy:
        condition: service_started
    networks: [patrol]
    volumes:
      - node-history:/data/history
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/github-patrol", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  github-patrol-proxy:
    image: metacubex/mihomo:${IPPURE_MIHOMO_TAG:-v1.19.27}
    restart: unless-stopped
    networks: [patrol]
    volumes:
      - ./deploy/ippure-mihomo.yaml:/root/.config/mihomo/config.yaml:ro
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  patrol:
