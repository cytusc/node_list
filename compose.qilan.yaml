# Append to COMPOSE_FILE to enable the Qilan source with a host session file.
services:
  source-ingest:
    environment:
      SOURCE_PROVIDERS: ${SOURCE_PROVIDERS:-subs-check,qilan,proxio-all,Jakee-http,xyzs996-all}
      QILAN_SESSION_FILE: /run/secrets/qilan-session.txt
      QILAN_REFRESH_INTERVAL_SECONDS: ${QILAN_REFRESH_INTERVAL_SECONDS:-900}
      QILAN_USER_AGENT: ${QILAN_USER_AGENT:-Mozilla/5.0}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
    volumes:
      - type: bind
        source: ${QILAN_SESSION_HOST_FILE:?Set QILAN_SESSION_HOST_FILE in .env}
        target: /run/secrets/qilan-session.txt
        read_only: true
        bind:
          create_host_path: false
