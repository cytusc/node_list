# Dedicated Mihomo instance: the collector loads isolated listeners per batch.
# Do not point the collector at a proxy instance used by other applications.
services:
  ippure-proxy:
    image: metacubex/mihomo:${IPPURE_MIHOMO_TAG:-v1.19.27}
    restart: unless-stopped
    networks:
      - ippure
    volumes:
      - ./deploy/ippure-mihomo.yaml:/root/.config/mihomo/config.yaml:ro
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  node-explorer:
    networks:
      - default
      - ippure
    depends_on:
      ippure-proxy:
        condition: service_started
    environment:
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      IP_API_PRO_KEY: ${IP_API_PRO_KEY:-}
      IPREGISTRY_API_KEY: ${IPREGISTRY_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      IPPURE_CONTROLLER: http://ippure-proxy:9090
      IPPURE_PROXY_URL: http://ippure-proxy:7890
      IPPURE_CONCURRENCY: ${IPPURE_CONCURRENCY:-3}
      IPPURE_API_ORIGIN: ${IPPURE_API_ORIGIN:-https://api.123169.xyz}

networks:
  ippure:
