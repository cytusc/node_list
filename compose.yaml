# Nine independently restartable application services. PostgreSQL is an existing external service.
x-environment: &environment
  PGHOST: ${PGHOST:?Set PGHOST in .env}
  PGPORT: ${PGPORT:-5432}
  PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
  PGUSER: ${PGUSER:?Set PGUSER in .env}
  PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
  PGPOOL_MAX: ${PGPOOL_MAX:-8}
  REDIS_URL: redis://task-redis:6379/0
  REDIS_NAMESPACE: ${REDIS_NAMESPACE:-node-explorer}
  RESIDENTIAL_INTERVAL_SECONDS: ${RESIDENTIAL_INTERVAL_SECONDS:-300}
  NORMAL_INTERVAL_SECONDS: ${NORMAL_INTERVAL_SECONDS:-1800}
  FAST_INTERVAL_SECONDS: ${FAST_INTERVAL_SECONDS:-1200}
  MIHOMO_MANAGER_URL: http://mihomo-manager:9080
  MIHOMO_MANAGER_TOKEN: ${MIHOMO_MANAGER_TOKEN:?Set MIHOMO_MANAGER_TOKEN in .env}
  # Validation mode suppresses automatic retirement, restore and physical deletion.
  LIFECYCLE_DRY_RUN: ${LIFECYCLE_DRY_RUN:-true}
x-app: &app
  image: ghcr.io/cytusc/node_list:${IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  environment: *environment
  networks: [default, postgres]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
x-worker: &worker
  <<: *app
  depends_on:
    task-redis: { condition: service_healthy }
x-proxy: &proxy
  image: metacubex/mihomo:${IPPURE_MIHOMO_TAG:-v1.19.27}
  restart: unless-stopped
  volumes:
    - ./deploy/ippure-mihomo.yaml:/root/.config/mihomo/config.yaml:ro
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  # 网页接口：PHP/webman（Workerman）。镜像默认 CMD 就是 php start.php start，
  # 这里不重复写 command。read_only 下 Workerman 要写 runtime/（pid/status/log），
  # 用 tmpfs 兜；容器重建即丢，无状态。
  node-explorer:
    <<: *app
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3001}:3001"
    tmpfs:
      - /tmp
      # 容器以 node(uid 1000) 运行，tmpfs 默认 755 root 不可写会导致 Workerman
      # 建 runtime/logs 等目录 Permission denied 而崩溃；mode=0777 放行（CI 冒烟同款）。
      - /app/webman/runtime:mode=0777
  source-ingest:
    <<: *app
    command: [node-worker, -role, source]
    environment:
      <<: *environment
      SUBS_CHECK_DIR: /data/sub
    volumes:
      - type: bind
        source: ${SUBS_CHECK_HOST_DIR:?Set SUBS_CHECK_HOST_DIR in .env}
        target: /data/sub
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test: [CMD, node-worker, -role, source, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  connectivity:
    <<: *worker
    command: [node-worker, -role, connectivity]
    environment:
      <<: *environment
      PROBE_TIMEOUT_SECONDS: ${PROBE_TIMEOUT_SECONDS:-12}
      PROBE_RETRY_SECONDS: ${PROBE_RETRY_SECONDS:-10}
      CONNECTIVITY_HIGH_CONCURRENCY: ${CONNECTIVITY_HIGH_CONCURRENCY:-4}
      CONNECTIVITY_NORMAL_CONCURRENCY: ${CONNECTIVITY_NORMAL_CONCURRENCY:-20}
    depends_on:
      task-redis: { condition: service_healthy }
      mihomo-manager: { condition: service_healthy }
    healthcheck:
      test: [CMD, node-worker, -role, connectivity, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  ip-service:
    <<: *worker
    command: [node-worker, -role, ip]
    environment:
      <<: *environment
      IPPURE_API_ORIGIN: ${IPPURE_API_ORIGIN:-https://api.123169.xyz}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      IP_API_PRO_KEY: ${IP_API_PRO_KEY:-}
      IPREGISTRY_API_KEY: ${IPREGISTRY_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      IP_SERVICE_HIGH_CONCURRENCY: ${IP_SERVICE_HIGH_CONCURRENCY:-4}
      IP_SERVICE_NORMAL_CONCURRENCY: ${IP_SERVICE_NORMAL_CONCURRENCY:-4}
      IP_SERVICE_RISK_CONCURRENCY: ${IP_SERVICE_RISK_CONCURRENCY:-2}
    depends_on:
      task-redis: { condition: service_healthy }
      mihomo-manager: { condition: service_healthy }
    healthcheck:
      test: [CMD, node-worker, -role, ip, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  residential-recovery:
    <<: *worker
    command: [node-worker, -role, residential]
    healthcheck:
      test: [CMD, node-worker, -role, residential, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  normal-recovery:
    <<: *worker
    command: [node-worker, -role, normal-recovery]
    environment:
      <<: *environment
      NORMAL_RECOVERY_CONCURRENCY: ${NORMAL_RECOVERY_CONCURRENCY:-8}
      NORMAL_RECOVERY_INTERVAL_SECONDS: ${NORMAL_RECOVERY_INTERVAL_SECONDS:-1200}
      SCHEDULE_INTERVAL_SECONDS: 30
    healthcheck:
      test: [CMD, node-worker, -role, normal-recovery, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  node-cleanup:
    <<: *worker
    command: [node-worker, -role, node-cleanup]
    environment:
      <<: *environment
      SCHEDULE_INTERVAL_SECONDS: 30
    healthcheck:
      test: [CMD, node-worker, -role, node-cleanup, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  node-lifecycle:
    <<: *worker
    command: [node-worker, -role, lifecycle]
    environment:
      <<: *environment
      LIFECYCLE_DRY_RUN: ${LIFECYCLE_DRY_RUN:-true}
    healthcheck:
      test: [CMD, node-worker, -role, lifecycle, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  mihomo-manager:
    <<: *worker
    cpus: ${MIHOMO_MANAGER_CPUS:-0.5}
    command: [node-worker, -role, mihomo-manager]
    environment:
      <<: *environment
      MIHOMO_CONTROLLER: http://shared-mihomo:9090
      MIHOMO_PROXY_URL: http://shared-mihomo:7890
      MIHOMO_CONTROLLER_SECRET: ${MIHOMO_CONTROLLER_SECRET:?Set MIHOMO_CONTROLLER_SECRET in .env}
    depends_on:
      task-redis: { condition: service_healthy }
      shared-mihomo: { condition: service_started }
    healthcheck:
      test: [CMD, node-worker, -role, mihomo-manager, -health]
      interval: 10s
      timeout: 5s
      start_period: 30s
  shared-mihomo:
    <<: *proxy
    cpus: ${MIHOMO_CPUS:-1.0}
    environment:
      MIHOMO_CONTROLLER_SECRET: ${MIHOMO_CONTROLLER_SECRET:?Set MIHOMO_CONTROLLER_SECRET in .env}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        test -n "$$MIHOMO_CONTROLLER_SECRET"
        printf 'mixed-port: 7890\nallow-lan: true\nbind-address: "*"\nexternal-controller: 0.0.0.0:9090\nsecret: "%s"\nmode: rule\nauthentication: ["disabled:disabled"]\nrules: ["MATCH,REJECT"]\n' "$$MIHOMO_CONTROLLER_SECRET" > /tmp/bootstrap.yaml
        exec /mihomo -d /tmp/mihomo -f /tmp/bootstrap.yaml
  task-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [task-redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
networks:
  postgres:
    external: true
    name: ${POSTGRES_NETWORK:?Set POSTGRES_NETWORK in .env}
volumes:
  task-redis:
