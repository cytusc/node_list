# Five independently restartable application services. PostgreSQL is an existing external service.
x-environment: &environment
  PGHOST: ${PGHOST:?Set PGHOST in .env}
  PGPORT: ${PGPORT:-5432}
  PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
  PGUSER: ${PGUSER:?Set PGUSER in .env}
  PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
  PGPOOL_MAX: ${PGPOOL_MAX:-8}
x-app: &app
  image: ghcr.io/cytusc/node_list:${IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  environment: *environment
  networks: [default, postgres]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  # 网页接口：PHP/webman（Workerman）。镜像默认 CMD 就是 php start.php start，
  # 这里不重复写 command。read_only 下 Workerman 要写 runtime/（pid/status/log），
  # 用 tmpfs 兜；容器重建即丢，无状态。
  node-explorer:
    <<: *app
    environment:
      <<: *environment
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      OPEN_API_APP_ID: ${OPEN_API_APP_ID:-}
      OPEN_API_SECRET: ${OPEN_API_SECRET:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3001}:3001"
    tmpfs:
      - /tmp
      # 容器以 node(uid 1000) 运行，tmpfs 默认 755 root 不可写会导致 Workerman
      # 建 runtime/logs 等目录 Permission denied 而崩溃；mode=0777 放行（CI 冒烟同款）。
      - /app/webman/runtime:mode=0777
  source-ingest:
    <<: *app
    command: [node-source]
    environment:
      PGHOST: ${PGHOST:?Set PGHOST in .env}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
      PGUSER: ${PGUSER:?Set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      PGPOOL_MAX: ${SOURCE_PGPOOL_MAX:-4}
      SOURCE_CONVERTER: /app/services/node-source-converter/converter.mjs
      SOURCE_SUBSCRIPTIONS: ${SOURCE_SUBSCRIPTIONS:-}
      SOURCE_PROVIDERS: ${SOURCE_PROVIDERS:-subs-check,proxio-all,Jakee-http,xyzs996-all}
      PUBLIC_PROXY_REFRESH_INTERVAL_SECONDS: ${PUBLIC_PROXY_REFRESH_INTERVAL_SECONDS:-1800}
      SUBS_CHECK_DIR: /data/sub
    volumes:
      - type: bind
        source: ${SUBS_CHECK_HOST_DIR:?Set SUBS_CHECK_HOST_DIR in .env}
        target: /data/sub
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test: [CMD, node-source, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  exit-provision:
    <<: *app
    command: [node-exit]
    environment:
      PGHOST: ${PGHOST:?Set PGHOST in .env}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
      PGUSER: ${PGUSER:?Set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      PGSSLMODE: ${PGSSLMODE:-prefer}
      EXIT_WORKERS: ${EXIT_WORKERS:-4}
      EXIT_TIMEOUT_SECONDS: ${EXIT_TIMEOUT_SECONDS:-25}
      EXIT_INTERVAL_SECONDS: ${EXIT_INTERVAL_SECONDS:-1800}
      EXIT_RETRY_SECONDS: ${EXIT_RETRY_SECONDS:-300}
    healthcheck:
      test: [CMD, node-exit, -health]
      interval: 10s
      timeout: 6s
      start_period: 60s
  exit-attributes:
    <<: *app
    command: [node-attributes]
    environment:
      PGHOST: ${PGHOST:?Set PGHOST in .env}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
      PGUSER: ${PGUSER:?Set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      ATTR_WORKERS: ${ATTR_WORKERS:-3}
      ATTR_TIMEOUT_SECONDS: ${ATTR_TIMEOUT_SECONDS:-45}
      ATTR_RETRY_SECONDS: ${ATTR_RETRY_SECONDS:-1800}
      IPPURE_API_ORIGIN: ${IPPURE_API_ORIGIN:-https://api.123169.xyz}
      IP_PROVIDERS: ${IP_PROVIDERS:-}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      IP_API_PRO_KEY: ${IP_API_PRO_KEY:-}
      IPREGISTRY_API_KEY: ${IPREGISTRY_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    healthcheck:
      test: [CMD, node-attributes, -health]
      interval: 10s
      timeout: 6s
      start_period: 60s
  node-liveness:
    <<: *app
    command: [node-liveness]
    environment:
      PGHOST: ${PGHOST:?Set PGHOST in .env}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
      PGUSER: ${PGUSER:?Set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      PGSSLMODE: ${PGSSLMODE:-prefer}
      LIVENESS_XRAY_WORKERS: ${LIVENESS_XRAY_WORKERS:-12}
      LIVENESS_MIHOMO_WORKERS: ${LIVENESS_MIHOMO_WORKERS:-12}
      LIVENESS_TIMEOUT_SECONDS: ${LIVENESS_TIMEOUT_SECONDS:-8}
      LIVENESS_INTERVAL_SECONDS: ${LIVENESS_INTERVAL_SECONDS:-1800}
      LIVENESS_RETRY_SECONDS: ${LIVENESS_RETRY_SECONDS:-60}
      LIVENESS_MAX_BACKOFF_SECONDS: ${LIVENESS_MAX_BACKOFF_SECONDS:-86400}
    healthcheck:
      test: [CMD, node-liveness, -health]
      interval: 10s
      timeout: 6s
      start_period: 60s
networks:
  postgres:
    external: true
    name: ${POSTGRES_NETWORK:?Set POSTGRES_NETWORK in .env}
