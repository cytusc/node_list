services:
  node-explorer:
    image: ghcr.io/cytusc/node_list:${IMAGE_TAG:-v1.3.7}
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3001}:3001"
    environment:
      SUBS_CHECK_DIR: /data/sub
      DATABASE_PATH: /data/history/nodes.sqlite
    volumes:
      - node-history:/data/history
      - type: bind
        source: ${SUBS_CHECK_HOST_DIR:?Set SUBS_CHECK_HOST_DIR in .env}
        target: /data/sub
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  node-history:
