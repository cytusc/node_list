# Seven independently restartable application services. PostgreSQL is an existing external service.
x-environment: &environment
  PGHOST: ${PGHOST:?Set PGHOST in .env}
  PGPORT: ${PGPORT:-5432}
  PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
  PGUSER: ${PGUSER:?Set PGUSER in .env}
  PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
  PGPOOL_MAX: ${PGPOOL_MAX:-8}
  REDIS_URL: redis://task-redis:6379/0
  REDIS_NAMESPACE: ${REDIS_NAMESPACE:-node-explorer}
  NORMAL_INTERVAL_SECONDS: ${NORMAL_INTERVAL_SECONDS:-1800}
  MIHOMO_EXIT_CONCURRENCY: ${MIHOMO_EXIT_CONCURRENCY:-8}
  MIHOMO_RISK_CONCURRENCY: ${MIHOMO_RISK_CONCURRENCY:-2}
  MIHOMO_MANAGER_URL: http://mihomo-manager:9080
  MIHOMO_MANAGER_TOKEN: ${MIHOMO_MANAGER_TOKEN:?Set MIHOMO_MANAGER_TOKEN in .env}
  # Validation mode suppresses automatic retirement, restore and physical deletion.
  LIFECYCLE_DRY_RUN: ${LIFECYCLE_DRY_RUN:-true}
x-app: &app
  image: ghcr.io/cytusc/node_list:${IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  environment: *environment
  networks: [default, postgres]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
x-worker: &worker
  <<: *app
  depends_on:
    task-redis: { condition: service_healthy }
x-proxy: &proxy
  image: metacubex/mihomo:${IPPURE_MIHOMO_TAG:-v1.19.27}
  restart: unless-stopped
  volumes:
    - ./deploy/ippure-mihomo.yaml:/root/.config/mihomo/config.yaml:ro
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  # 网页接口：PHP/webman（Workerman）。镜像默认 CMD 就是 php start.php start，
  # 这里不重复写 command。read_only 下 Workerman 要写 runtime/（pid/status/log），
  # 用 tmpfs 兜；容器重建即丢，无状态。
  node-explorer:
    <<: *app
    environment:
      <<: *environment
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3001}:3001"
    tmpfs:
      - /tmp
      # 容器以 node(uid 1000) 运行，tmpfs 默认 755 root 不可写会导致 Workerman
      # 建 runtime/logs 等目录 Permission denied 而崩溃；mode=0777 放行（CI 冒烟同款）。
      - /app/webman/runtime:mode=0777
  source-ingest:
    <<: *app
    command: [node-worker, -role, source]
    environment:
      <<: *environment
      SOURCE_PROVIDERS: ${SOURCE_PROVIDERS:-subs-check,proxio-all,Jakee-http,xyzs996-all}
      PUBLIC_PROXY_REFRESH_INTERVAL_SECONDS: ${PUBLIC_PROXY_REFRESH_INTERVAL_SECONDS:-1800}
      # 入库前的端点拨号（0 关闭）。端口完全不通的节点直接不入库，趁它们是
      # 垃圾而不是等它们进注册表再删。UDP 传输不参与。
      SOURCE_PROBE_SECONDS: ${SOURCE_PROBE_SECONDS:-3}
      SOURCE_PROBE_CONCURRENCY: ${SOURCE_PROBE_CONCURRENCY:-256}
      SOURCE_PROBE_BUDGET_SECONDS: ${SOURCE_PROBE_BUDGET_SECONDS:-120}
      # 探测链路自身的健康对照端点：全部不通就视为出口故障，整批放行。
      SOURCE_PROBE_CONTROL: ${SOURCE_PROBE_CONTROL:-1.1.1.1:443,8.8.8.8:53,223.5.5.5:443}
      # 已判定死亡的连接在这个冷却期内不再被同源重新灌入（0 关闭）。
      SOURCE_DELETED_COOLDOWN_HOURS: ${SOURCE_DELETED_COOLDOWN_HOURS:-12}
      SUBS_CHECK_DIR: /data/sub
    volumes:
      - type: bind
        source: ${SUBS_CHECK_HOST_DIR:?Set SUBS_CHECK_HOST_DIR in .env}
        target: /data/sub
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test: [CMD, node-worker, -role, source, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  exit-provision:
    <<: *worker
    command: [node-worker, -role, exit-provision]
    environment:
      <<: *environment
      IP_SERVICE_HIGH_CONCURRENCY: ${EXIT_PROVISION_HIGH_CONCURRENCY:-8}
      IP_SERVICE_NORMAL_CONCURRENCY: ${EXIT_PROVISION_NORMAL_CONCURRENCY:-8}
    depends_on:
      task-redis: { condition: service_healthy }
      mihomo-manager: { condition: service_healthy }
    healthcheck:
      test: [CMD, node-worker, -role, exit-provision, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  exit-attributes:
    <<: *worker
    command: [node-worker, -role, exit-attributes]
    environment:
      <<: *environment
      # More consumers used to make this lane worse, because every job spent its
      # own single-IP quota slot. Classification is now batch-first: one priming
      # wave covers 100 addresses, duplicate waves are collapsed, and a cached
      # address costs no quota at all — so consumers add throughput instead of
      # contention. Keep the product of this and PGPOOL_MAX in mind.
      IP_SERVICE_ATTRIBUTES_CONCURRENCY: ${ATTRIBUTES_CONCURRENCY:-3}
      IPPURE_API_ORIGIN: ${IPPURE_API_ORIGIN:-https://api.123169.xyz}
      # Comma separated subset of ipinfo,ip-api,ipregistry,abuseipdb,ipapi,
      # ip2location. Empty keeps every source; deployments without credentials
      # for some of them should narrow the list instead of querying blind.
      IP_PROVIDERS: ${IP_PROVIDERS:-}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      IP_API_PRO_KEY: ${IP_API_PRO_KEY:-}
      IPREGISTRY_API_KEY: ${IPREGISTRY_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      IP_SERVICE_RISK_CONCURRENCY: ${EXIT_ATTRIBUTES_RISK_CONCURRENCY:-2}
    depends_on:
      task-redis: { condition: service_healthy }
      mihomo-manager: { condition: service_healthy }
    healthcheck:
      test: [CMD, node-worker, -role, exit-attributes, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  recovery:
    <<: *worker
    command: [node-worker, -role, recovery]
    environment:
      <<: *environment
      NORMAL_RECOVERY_CONCURRENCY: ${NORMAL_RECOVERY_CONCURRENCY:-8}
      NORMAL_RECOVERY_INTERVAL_SECONDS: ${NORMAL_RECOVERY_INTERVAL_SECONDS:-1200}
      RECOVERY_RECOVERY_CONCURRENCY: ${RECOVERY_RECOVERY_CONCURRENCY:-2}
      RECOVERY_LIFECYCLE_CONCURRENCY: ${RECOVERY_LIFECYCLE_CONCURRENCY:-1}
      # 二验探针 lane：退役与恢复评估的受控连通性探针走这里，
      # 此处控制恢复探针并发，不影响 dead-verify 的核验并发。
      RECOVERY_LIVE_CONCURRENCY: ${RECOVERY_LIVE_CONCURRENCY:-2}
    depends_on:
      task-redis: { condition: service_healthy }
      mihomo-manager: { condition: service_healthy }
    healthcheck:
      test: [CMD, node-worker, -role, recovery, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  # 死节点批量核验：本服务自带一个独立 mihomo，装载候选节点后逐个做真实握手
  # （/proxies/<name>/delay）。共享内核的 strict lane 只有 8 路、单节点约 60 秒，
  # 四万积压要 90 小时；而且 Cloudflare 前置的节点 TCP 永远连得上，只有完整
  # 握手才能判死。每批判定仍交给 deleteUnavailable 的全部门禁，从不自行删除。
  dead-verify:
    <<: *worker
    command: [dead-verify]
    environment:
      <<: *environment
      DEAD_VERIFY_LIMIT: ${DEAD_VERIFY_LIMIT:-400}
      DEAD_VERIFY_WORKERS: ${DEAD_VERIFY_WORKERS:-96}
      DEAD_VERIFY_DELETERS: ${DEAD_VERIFY_DELETERS:-8}
      DEAD_VERIFY_TIMEOUT_SECONDS: ${DEAD_VERIFY_TIMEOUT_SECONDS:-6}
      DEAD_VERIFY_RECHECK_SECONDS: ${DEAD_VERIFY_RECHECK_SECONDS:-21600}
      # 候选筛选与最终删除门禁共用年龄配置。
      NODE_CLEANUP_MIN_AGE_SECONDS: ${NODE_CLEANUP_MIN_AGE_SECONDS:-604800}
      # 生存集下限：可用节点少于这个数就停止删除，防止源断供或出口故障时
      # 把注册表删空。0 关闭。
      NODE_CLEANUP_MIN_POOL: ${NODE_CLEANUP_MIN_POOL:-500}
    cpus: ${DEAD_VERIFY_CPUS:-1}
    healthcheck:
      test: [CMD, node-worker, -role, dead-verify, -health]
      interval: 30s
      timeout: 10s
      start_period: 60s
  mihomo-manager:
    <<: *worker
    cpus: ${MIHOMO_MANAGER_CPUS:-0.5}
    command: [node-worker, -role, mihomo-manager]
    environment:
      <<: *environment
      MIHOMO_CONTROLLER: http://shared-mihomo:9090
      MIHOMO_PROXY_URL: http://shared-mihomo:7890
      MIHOMO_CONTROLLER_SECRET: ${MIHOMO_CONTROLLER_SECRET:?Set MIHOMO_CONTROLLER_SECRET in .env}
      MIHOMO_REGISTRY_POLL_SECONDS: ${MIHOMO_REGISTRY_POLL_SECONDS:-30}
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-1800}
      SWEEP_CONCURRENCY: ${SWEEP_CONCURRENCY:-32}
    depends_on:
      shared-mihomo: { condition: service_started }
    healthcheck:
      test: [CMD, node-worker, -role, mihomo-manager, -health]
      interval: 10s
      timeout: 5s
      start_period: 120s
  shared-mihomo:
    <<: *proxy
    cpus: ${MIHOMO_CPUS:-1.0}
    environment:
      MIHOMO_CONTROLLER_SECRET: ${MIHOMO_CONTROLLER_SECRET:?Set MIHOMO_CONTROLLER_SECRET in .env}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        test -n "$$MIHOMO_CONTROLLER_SECRET"
        printf 'mixed-port: 7890\nallow-lan: true\nbind-address: "*"\nexternal-controller: 0.0.0.0:9090\nsecret: "%s"\nmode: rule\nauthentication: ["disabled:disabled"]\nrules: ["MATCH,REJECT"]\n' "$$MIHOMO_CONTROLLER_SECRET" > /tmp/bootstrap.yaml
        exec /mihomo -d /tmp/mihomo -f /tmp/bootstrap.yaml
  task-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [task-redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
networks:
  postgres:
    external: true
    name: ${POSTGRES_NETWORK:?Set POSTGRES_NETWORK in .env}
volumes:
  task-redis:
